# Landlink protocol — single source of truth.
# Consumed by:
#   firmware/tools/gen_protocol.py  -> src/shared/protocol/opcodes.h, tlv_tags.h
#                                   -> ../src/shared/protocol/landlink.ts, uuids.ts
# Never hand-edit the generated files. Edit this spec and re-run codegen.

version: 1
firmware_name: "landlink"
proto_version: 3

ble:
  # 128-bit custom UUIDs (8-4-4-4-12). Base encodes "LL-landlink-1" in ASCII
  # across the trailing groups; the last 2 bytes discriminate the service
  # and its characteristics.
  service_uuid: "4c4c0001-6c61-6e64-6c69-6e6b2d310001"
  characteristics:
    CMD:   { uuid: "4c4c0002-6c61-6e64-6c69-6e6b2d310001", props: [write] }
    EVT:   { uuid: "4c4c0003-6c61-6e64-6c69-6e6b2d310001", props: [notify] }
    STATE: { uuid: "4c4c0004-6c61-6e64-6c69-6e6b2d310001", props: [read, notify] }
    INFO:  { uuid: "4c4c0005-6c61-6e64-6c69-6e6b2d310001", props: [read] }
    # Firmware image data during an OTA session. Raw binary frames, not
    # CMD/TLV framing: [offset u32 LE][crc32 u32 LE][data]. crc32 is
    # CRC-32/ISO-HDLC (zlib) over data only.
    OTA:   { uuid: "4c4c0006-6c61-6e64-6c69-6e6b2d310001", props: [write_no_response] }
    LOG:   { uuid: "4c4c0007-6c61-6e64-6c69-6e6b2d310001", props: [notify] }
    # Bulk media data. Raw binary frames, not CMD/TLV framing:
    #   upload   (C->F, write_no_response): [0x01][xfer_id u32 LE][offset u32 LE][data]
    #   download (F->C, notify):            [0x02][xfer_id u32 LE][offset u32 LE][data]
    BULK:  { uuid: "4c4c0008-6c61-6e64-6c69-6e6b2d310001", props: [write_no_response, notify] }
  device_name_prefix: "Landlink-"

# USB serial transport (Web Serial). Carries the same CMD / EVT / STATE / INFO
# traffic as the BLE service over the board's USB port at 115200 8N1 (the baud
# rate is ignored on native USB boards). Not consumed by codegen; the web side
# mirrors these constants by hand.
#   firmware: src/shared/protocol/serial_frame.{h,cpp}, src/transport/serial/
serial:
  # [magic0][magic1][chan:u8][len:u16 LE][payload: len bytes][crc:u16 LE]
  magic: [0xA7, 0x4C]
  max_payload: 1024
  # CRC-16/CCITT-FALSE: poly 0x1021, init 0xFFFF, no reflection, xorout 0x0000,
  # computed over chan + the two len bytes + payload (not the magic).
  # Check value: ASCII "123456789" -> 0x29B1.
  # Vector: INFO_REQ (chan 0x04, empty) = A7 4C 04 00 00 5C 10.
  crc: { name: CRC-16/CCITT-FALSE, poly: 0x1021, init: 0xFFFF, refin: false, refout: false, xorout: 0x0000 }
  # Receivers skip bytes outside a frame (boot ROM text, stray log output) and
  # drop a candidate with a bad CRC or len > max_payload, then rescan from the
  # byte after its first magic byte for the next A7 4C.
  channels:
    CMD:       { code: 0x01, dir: C_TO_F, note: "Landlink CMD frame [opcode][seq][len LE][payload], same bytes as a BLE CMD write. An unknown opcode is answered with an ERROR EVT (ERR_CODE=BAD_ARG)." }
    EVT:       { code: 0x02, dir: F_TO_C, note: "Landlink EVT frame [opcode][seq][len LE][payload], byte-identical to the BLE EVT notify value. EVTs are broadcast to every host transport; match responses by seq." }
    STATE:     { code: 0x03, dir: F_TO_C, note: "[fsm_state][flags], same 2 bytes as the BLE STATE characteristic. Also sent once when a session opens." }
    INFO_REQ:  { code: 0x04, dir: C_TO_F, note: "Empty. Answered with INFO_RESP." }
    INFO_RESP: { code: 0x05, dir: F_TO_C, note: "INFO blob, same bytes as the BLE INFO characteristic: [proto_version][node_id u32 LE][fw_len][fw][hw_len][hw], then since proto 3 [target_len][target]." }
    LOG:       { code: 0x06, dir: F_TO_C, note: "One UTF-8 log line, no trailing newline, e.g. \"[I][main] setup complete\"." }
    KEEPALIVE: { code: 0x07, dir: C_TO_F, note: "Empty. Only refreshes the session." }
  session:
    # Any valid host frame opens the session (the device then pushes STATE) or
    # refreshes it. While open, EVT / STATE / LOG frames are written and the
    # device prints no raw text. Outside a session the port carries plain-text
    # logs only.
    keepalive_interval_ms: 20000
    timeout_ms: 60000
    # Native USB boards (USB Serial/JTAG) also end the session as soon as the
    # USB host disappears (cable unplugged). Closing the port without
    # unplugging is only detected by the timeout.

# FSM states surfaced through STATE characteristic.
fsm_states:
  BOOT:                0x00
  SELF_TEST:           0x01
  UNPROVISIONED:       0x02
  PAIRING:             0x03
  WIFI_PROVISIONING:   0x04
  LORA_PAIRING:        0x05
  READY:               0x06
  OTA:                 0x07
  FACTORY_RESET:       0x08
  FAULT:               0xFF

# BLE opcodes (C = Client/Web, F = Firmware)
opcodes:
  # WiFi onboarding
  WIFI_SCAN:             { code: 0x01, dir: C_TO_F }
  WIFI_SCAN_RESULT:      { code: 0x02, dir: F_TO_C }
  WIFI_CONNECT:          { code: 0x03, dir: C_TO_F }
  WIFI_STATUS:           { code: 0x04, dir: F_TO_C }
  WIFI_GET_STATUS:       { code: 0x05, dir: C_TO_F, note: "Request the current WIFI_STATUS (state/ip/rssi). Lets the client refresh the persisted Wi-Fi state on every (re)connect." }

  # Radio region
  RADIO_GET_REGION:      { code: 0x10, dir: C_TO_F }
  RADIO_SET_REGION:      { code: 0x11, dir: C_TO_F }
  RADIO_REGION_RESULT:   { code: 0x12, dir: F_TO_C }

  # Node mode: what the node may do on air (see node_modes below). Reuses
  # 0x13-0x15, freed when the radio-protocol-mode toggle was removed.
  RADIO_GET_MODE:        { code: 0x13, dir: C_TO_F }
  RADIO_SET_MODE:        { code: 0x14, dir: C_TO_F }
  RADIO_MODE_RESULT:     { code: 0x15, dir: F_TO_C }

  # Node role for CSMA/CA scheduling (0=client, 1=router, 2=repeater).
  # Router/Repeater nodes skip the client rebroadcast offset, guaranteeing
  # they relay before client-class nodes when both hear the same packet.
  RADIO_GET_ROLE:        { code: 0x16, dir: C_TO_F }
  RADIO_SET_ROLE:        { code: 0x17, dir: C_TO_F }
  RADIO_ROLE_RESULT:     { code: 0x18, dir: F_TO_C }

  # Peer awareness. LORA_PEER_FOUND is pushed unsolicited whenever the firmware
  # hears a Meshtastic NodeInfo (identity) or Position (GPS) from a mesh peer,
  # so the host can populate its node list + map. (0x20/0x22/0x23 retired: the
  # Landlink BEACON discovery poll and X25519 pairing handshake are gone.)
  LORA_PEER_FOUND:       { code: 0x21, dir: F_TO_C }

  # Wi-Fi mesh (ESP-NOW). A per-device toggle: while enabled the radio leaves
  # any home AP, parks on a fixed channel and exchanges text and media with
  # nearby Landlinks. Text rides MESH_SEND / MESH_RECV with TRANSPORT=1.
  WMESH_SET:             { code: 0x24, dir: C_TO_F, note: "WMESH_ENABLED u8, optional WMESH_CHANNEL (1, 6 or 11). Persisted. Answered with WMESH_STATUS." }
  WMESH_GET_STATUS:      { code: 0x25, dir: C_TO_F }
  WMESH_STATUS:          { code: 0x26, dir: F_TO_C, note: "WMESH_ENABLED, WMESH_CHANNEL, WMESH_PEER_COUNT." }
  WMESH_PEERS:           { code: 0x27, dir: F_TO_C, note: "WMESH_PAGE + WMESH_PEER_LIST. Page 0 starts a fresh list; pages follow in order." }

  # Mesh membership + messaging
  MESH_JOIN:             { code: 0x30, dir: C_TO_F }
  MESH_LEAVE:            { code: 0x31, dir: C_TO_F }
  MESH_SEND:             { code: 0x32, dir: C_TO_F, note: "Optional CHANNEL_INDEX TLV selects the channel (default 0 = Primary)." }
  MESH_RECV:             { code: 0x33, dir: F_TO_C, note: "Always carries CHANNEL_INDEX so the host can demux into the right channel feed." }
  MESH_SEND_RESULT:      { code: 0x34, dir: F_TO_C, note: "Returns assigned pkt_id for a MESH_SEND so the host can track ACKs. Emitted in both Landlink and Meshtastic modes." }

  # Channel management. Channels are (name, PSK) pairs mirroring the Meshtastic
  # channel concept; up to 8 per device (index 0..7). Index 0 = Primary (cannot
  # be deleted). Both Landlink and Meshtastic protocol modes use the same
  # channel registry. CHANNEL_LIST_RESULT streams one EVT per occupied slot.
  CHANNEL_LIST:          { code: 0x35, dir: C_TO_F }
  CHANNEL_LIST_RESULT:   { code: 0x36, dir: F_TO_C, note: "One EVT per occupied slot. PSK always included so the phone can rebuild Meshtastic share URLs across reconnects (the SET path is ungated, so asymmetric readback gating provided no real security)." }
  CHANNEL_SET:           { code: 0x37, dir: C_TO_F, note: "Not gated on authed(); mirrors MESH_JOIN's posture so unprovisioned devices can still receive channel config." }
  CHANNEL_DELETE:        { code: 0x38, dir: C_TO_F }
  CHANNEL_RESULT:        { code: 0x39, dir: F_TO_C, note: "Emitted after SET (carries new slot TLVs) and DELETE (CHANNEL_INDEX only)." }

  # Media over the Wi-Fi mesh. The phone uploads a file into the device's flash
  # buffer over the BULK characteristic, the device ships it to nearby nodes
  # over ESP-NOW, and the receiving phone pulls it back out over BULK.
  MEDIA_UP_BEGIN:        { code: 0x64, dir: C_TO_F, note: "MEDIA_SIZE, MEDIA_MIME, MEDIA_SHA256, CHANNEL_INDEX, optional NODE_ID (DM), optional MEDIA_CAPTION." }
  MEDIA_UP_READY:        { code: 0x65, dir: F_TO_C, note: "MEDIA_XFER_ID + MEDIA_CHUNK (max BULK data bytes per write). Same seq as MEDIA_UP_BEGIN." }
  MEDIA_UP_ACK:          { code: 0x66, dir: F_TO_C, note: "MEDIA_XFER_ID + MEDIA_OFFSET = bytes received contiguously so far." }
  MEDIA_UP_COMMIT:       { code: 0x67, dir: C_TO_F, note: "MEDIA_XFER_ID. Device verifies SHA-256 then starts the Wi-Fi transfer." }
  MEDIA_SEND_RESULT:     { code: 0x68, dir: F_TO_C, note: "MEDIA_XFER_ID + ACK_PKT_ID. Same seq as MEDIA_UP_COMMIT." }
  MEDIA_PROGRESS:        { code: 0x69, dir: F_TO_C, note: "MEDIA_XFER_ID, MEDIA_PHASE, MEDIA_DONE_BYTES, MEDIA_SIZE, MEDIA_PEERS_OK, MEDIA_PEERS_FAIL, optional ERR_CODE." }
  MEDIA_RECV:            { code: 0x6A, dir: F_TO_C, note: "A complete inbound file is buffered on the device. NODE_ID (sender), NODE_DST, CHANNEL_INDEX, MEDIA_XFER_ID, MEDIA_SIZE, MEDIA_MIME, MEDIA_SHA256, optional MEDIA_CAPTION, optional CHAT_PKI_ENCRYPTED." }
  MEDIA_DOWN_REQ:        { code: 0x6B, dir: C_TO_F, note: "MEDIA_XFER_ID, MEDIA_OFFSET, MEDIA_LENGTH (<=16 KiB). Device answers with BULK notifies." }
  MEDIA_RELEASE:         { code: 0x6C, dir: C_TO_F, note: "MEDIA_XFER_ID. Frees the inbound buffer after a verified download." }
  MEDIA_CANCEL:          { code: 0x6D, dir: C_TO_F, note: "MEDIA_XFER_ID. Aborts an upload or an outbound transfer." }
  MEDIA_LIST_PENDING:    { code: 0x6E, dir: C_TO_F, note: "Re-emits MEDIA_RECV for every inbound file still buffered." }

  # Device telemetry (battery + GPS), pushed periodically while BLE is connected
  DEVICE_TELEMETRY:      { code: 0x70, dir: F_TO_C }

  # Key management
  KEY_ROTATE:            { code: 0x40, dir: C_TO_F }
  KEY_EXPORT:            { code: 0x41, dir: C_TO_F, requires: pairing_state }

  # BLE-level pairing handshake (X25519 + fingerprint confirm)
  PAIR_BEGIN:            { code: 0x48, dir: C_TO_F }
  PAIR_CHALLENGE:        { code: 0x49, dir: F_TO_C }
  PAIR_CONFIRM:          { code: 0x4A, dir: C_TO_F }
  PAIR_RESULT:           { code: 0x4B, dir: F_TO_C }

  # Factory reset (requires pinned session)
  FACTORY_RESET:         { code: 0x50, dir: C_TO_F, requires: authed }

  # OTA (proto 3+). BLE only; refused over serial and the relay.
  # Signed message: "LLOTA1" || sha256(image) || u8 len || OTA_TARGET || u8 len || OTA_VERSION,
  # Ed25519 with the key embedded from firmware/keys/ota_pubkey.bin. The
  # signature is the only gate (no authed()); it is checked before any flash
  # is touched.
  OTA_BEGIN:             { code: 0x60, dir: C_TO_F, note: "OTA_SIZE, OTA_SHA256, OTA_SIG_ED25519, OTA_TARGET, OTA_VERSION. Answered with OTA_STATUS(READY, OTA_OFFSET=0, OTA_CHUNK_MAX) on the same seq, or ERROR (WRONG_TARGET, CRYPTO_FAIL, NO_SPACE, BUSY, BAD_STATE)." }
  OTA_CHUNK:             { code: 0x61, dir: C_TO_F, note: "Not a CMD frame; image data goes over the OTA characteristic." }
  OTA_COMMIT:            { code: 0x62, dir: C_TO_F, note: "Device checks SHA-256, switches the boot slot, answers OTA_STATUS(REBOOTING) on the same seq, then restarts. ERROR(CRYPTO_FAIL) on hash mismatch." }
  OTA_STATUS:            { code: 0x63, dir: F_TO_C, note: "OTA_STATE + OTA_OFFSET (+ OTA_CHUNK_MAX on READY). RECEIVING acks use seq 0 and are sent every 4 KiB and on every gap or bad CRC; OTA_OFFSET is the contiguous byte count written." }
  OTA_ABORT:             { code: 0x6F, dir: C_TO_F, note: "Drops the session. The device also aborts after 30 s without a chunk or when the BLE link drops." }

  # Remote relay onboarding. The phone reads the device's self-generated
  # identity (pubkey + rendezvous id) over the trusted BLE link, enrolls it to
  # the user's anonymous account at the relay, then pushes the relay URL + the
  # account binding so the device can open its own outbound WSS to the relay.
  # Once connected, the relay tunnels opaque BLE frames between phone and device
  # so the exact same wire protocol works remotely.
  REMOTE_GET_IDENTITY:    { code: 0x80, dir: C_TO_F }
  REMOTE_IDENTITY_RESULT: { code: 0x81, dir: F_TO_C, note: "Carries REMOTE_DEVICE_PUBKEY + REMOTE_RENDEZVOUS_ID + REMOTE_DEVICE_ECDH_PUB." }
  REMOTE_SET_CONFIG:     { code: 0x82, dir: C_TO_F, note: "Carries REMOTE_SERVER_URL + REMOTE_ACCOUNT_BIND + REMOTE_ACCOUNT_ECDH_PUB; device begins outbound relay connect." }
  REMOTE_STATUS:         { code: 0x83, dir: F_TO_C, note: "Carries REMOTE_STATE (0=off,1=connecting,2=online,3=error)." }
  REMOTE_COSIGN_ENROLL:  { code: 0x84, dir: C_TO_F, note: "Carries REMOTE_ACCOUNT_BIND (account identity pubkey); device co-signs the enrollment binding." }
  REMOTE_COSIGN_RESULT:  { code: 0x85, dir: F_TO_C, note: "Carries REMOTE_ENROLL_SIG (device signature over the enrollment binding)." }

  # Generic error
  ERROR:                 { code: 0x7F, dir: F_TO_C }

# TLV tag registry — shared between BLE payloads and mesh payloads.
# Tag ranges:
#   0x01-0x0F : kind discriminators + shared meta
#   0x10-0x1F : chat
#   0x20-0x2F : location
#   0x30-0x3F : sensor
#   0x40-0x4F : ack / routing
#   0x50-0x5F : beacon / peer meta
#   0x60-0x6F : Wi-Fi mesh + media
#   0x70-0x7F : pairing (X25519)
#   0x80-0x8F : BLE WiFi TLVs
#   0x90-0x9F : BLE OTA TLVs
#   0xA0-0xAF : BLE region TLVs
#   0xB0-0xBF : BLE mesh-membership TLVs
#   0xF0-0xFF : error/diagnostics
tlv_tags:
  # Meta
  KIND:                  { tag: 0x01, type: u8,   desc: "Payload kind discriminator" }
  # Context-sensitive identity. In MESH_RECV / LORA_PEER_FOUND /
  # DEVICE_TELEMETRY the NODE_ID is the originator (sender). In MESH_SEND it
  # is the unicast destination, and its presence promotes the outbound frame
  # from broadcast to unicast (firmware sets FlagUnicast and Meshtastic
  # MeshPacket.to=dst). Absence keeps the default broadcast behaviour.
  # On MESH_RECV the dst is reported separately via NODE_DST below so the
  # host can demux unicast DMs from channel broadcasts. Always 4 bytes, LE u32.
  NODE_ID:               { tag: 0x02, type: u32,  desc: "32-bit node id (sender in RX, destination in MESH_SEND)" }
  # Destination of a received frame. 0xFFFFFFFF means broadcast on the
  # channel; any other value means the frame was unicast to that node id.
  # Emitted by mesh_chat on every MESH_RECV so the host can route DMs to a
  # peer-keyed thread instead of the channel feed. Always 4 bytes, LE u32.
  NODE_DST:              { tag: 0x05, type: u32,  desc: "Destination u32 in MESH_RECV; 0xFFFFFFFF means broadcast." }
  MESH_ID:               { tag: 0x03, type: u16,  desc: "Mesh group id" }
  TIMESTAMP_MS:          { tag: 0x04, type: u64,  desc: "Unix time ms (best-effort)" }

  # Chat
  CHAT_TEXT:             { tag: 0x10, type: utf8, desc: "UTF-8 chat text, <=200 B" }
  CHAT_REPLY_TO:         { tag: 0x11, type: u32,  desc: "pkt_id being replied to" }
  CHAT_PKI_ENCRYPTED:    { tag: 0x12, type: u8,   desc: "1 if the originating LoRa frame was Meshtastic PKI-encrypted (DM)" }
  TRANSPORT:             { tag: 0x13, type: u8,   desc: "Link a chat rides on: 0=LoRa (default when absent), 1=Wi-Fi mesh" }
  MEDIA_CHUNK:           { tag: 0x14, type: u16,  desc: "Max BULK data bytes per write" }

  # Location
  LAT_E7:                { tag: 0x20, type: i32,  desc: "Latitude * 1e7" }
  LON_E7:                { tag: 0x21, type: i32,  desc: "Longitude * 1e7" }
  ALT_M:                 { tag: 0x22, type: i16,  desc: "Altitude meters" }
  HDOP:                  { tag: 0x23, type: u8,   desc: "HDOP * 10" }
  SPEED_KMH:             { tag: 0x24, type: u16,  desc: "Speed km/h * 10" }

  # Sensor
  BATTERY_MV:            { tag: 0x30, type: u16,  desc: "Battery voltage mV" }
  BATTERY_PCT:           { tag: 0x31, type: u8,   desc: "Battery %" }
  TEMP_C_E1:             { tag: 0x32, type: i16,  desc: "Temp C * 10" }
  RSSI_DBM:              { tag: 0x33, type: i8,   desc: "Last RX RSSI dBm" }
  SNR_DB_E1:             { tag: 0x34, type: i8,   desc: "Last RX SNR dB * 10" }
  CHARGE_STATE:          { tag: 0x35, type: u8,   desc: "bit0 VBUS, bit1 CHARGING, bit2 FULL, bit3 BATT_PRESENT" }

  # Routing / ack
  ACK_PKT_ID:            { tag: 0x40, type: u32 }
  HOP_LIMIT:             { tag: 0x41, type: u8 }
  RETRY_PKT_ID:          { tag: 0x42, type: u32, desc: "Landlink-only: on MESH_SEND, reuse this pkt_id instead of allocating a new one (chat retry)" }
  ROUTING_ERROR:         { tag: 0x43, type: u8,  desc: "Meshtastic Routing.Error reason carried by a KIND=NAK MESH_RECV (e.g. 6 NO_CHANNEL, 35 PKI_UNKNOWN_PUBKEY)" }

  # Beacon / peer meta
  NODE_NAME:             { tag: 0x50, type: utf8, desc: "Human-friendly peer name <=32 B" }
  CAP_FLAGS:             { tag: 0x51, type: u16,  desc: "Capability bitfield" }

  # Wi-Fi mesh
  WMESH_ENABLED:         { tag: 0x60, type: u8,    desc: "1 = Wi-Fi mesh on" }
  WMESH_CHANNEL:         { tag: 0x61, type: u8,    desc: "2.4 GHz channel (1, 6 or 11)" }
  WMESH_PEER_COUNT:      { tag: 0x62, type: u16,   desc: "Neighbors currently heard" }
  WMESH_PAGE:            { tag: 0x63, type: u8,    desc: "Page index of a WMESH_PEERS list; 0 starts a new list" }
  WMESH_PEER_LIST:       { tag: 0x64, type: bytes, desc: "Repeated [node_id u32 LE][quality u8 0..100][age_s u8]" }

  # Media
  MEDIA_DONE_BYTES:      { tag: 0x65, type: u32 }
  MEDIA_PEERS_OK:        { tag: 0x66, type: u8 }
  MEDIA_PEERS_FAIL:      { tag: 0x67, type: u8 }
  MEDIA_XFER_ID:         { tag: 0x68, type: u32 }
  MEDIA_SIZE:            { tag: 0x69, type: u32 }
  MEDIA_MIME:            { tag: 0x6A, type: u8,    desc: "MediaMime value" }
  MEDIA_SHA256:          { tag: 0x6B, type: bytes32 }
  MEDIA_OFFSET:          { tag: 0x6C, type: u32 }
  MEDIA_LENGTH:          { tag: 0x6D, type: u32 }
  MEDIA_PHASE:           { tag: 0x6E, type: u8,    desc: "MediaPhase value" }
  MEDIA_CAPTION:         { tag: 0x6F, type: utf8,  desc: "<=120 B" }

  # Pairing (X25519)
  PUBKEY_X25519:         { tag: 0x70, type: bytes32 }
  NONCE16:               { tag: 0x71, type: bytes16 }
  FINGERPRINT4:          { tag: 0x72, type: bytes4 }

  # BLE WiFi
  WIFI_SSID:             { tag: 0x80, type: utf8 }
  WIFI_PSK:              { tag: 0x81, type: utf8 }
  WIFI_RSSI:             { tag: 0x82, type: i8 }
  WIFI_AUTH:             { tag: 0x83, type: u8 }
  WIFI_IP:               { tag: 0x84, type: bytes4 }
  WIFI_STATE:            { tag: 0x85, type: u8 }

  # BLE OTA
  OTA_SIZE:              { tag: 0x90, type: u32 }
  OTA_SHA256:            { tag: 0x91, type: bytes32 }
  OTA_SIG_ED25519:       { tag: 0x92, type: bytes64 }
  OTA_CHUNK_SEQ:         { tag: 0x93, type: u32, desc: "Deprecated (proto 2 chunk framing). Unused." }
  OTA_CHUNK_CRC32:       { tag: 0x94, type: u32, desc: "Deprecated (proto 2 chunk framing). Unused." }
  OTA_PROGRESS_PCT:      { tag: 0x95, type: u8,  desc: "Deprecated. Unused." }
  OTA_TARGET:            { tag: 0x96, type: utf8, desc: "Firmware target id, e.g. heltec-v3-sx1262" }
  OTA_VERSION:           { tag: 0x97, type: utf8, desc: "Version string of the image, e.g. 0.3.1" }
  OTA_OFFSET:            { tag: 0x98, type: u32 }
  OTA_STATE:             { tag: 0x99, type: u8,   desc: "OtaState value" }
  OTA_CHUNK_MAX:         { tag: 0x9A, type: u16,  desc: "Max data bytes per OTA characteristic write" }

  # BLE region
  REGION:                { tag: 0xA0, type: u8 }
  NODE_MODE:             { tag: 0xA1, type: u8, desc: "Node mode: 0=relay, 1=tx only, 2=rx only" }
  ROLE:                  { tag: 0xA2, type: u8, desc: "Node CSMA/CA role: 0=client, 1=router, 2=repeater" }

  # BLE mesh membership
  MESH_KEY:              { tag: 0xB0, type: bytes32 }
  MESH_SALT:             { tag: 0xB1, type: bytes8 }

  # Channels
  CHANNEL_INDEX:         { tag: 0xC0, type: u8,    desc: "Channel index 0..7" }
  CHANNEL_NAME:          { tag: 0xC1, type: utf8,  desc: "Channel name, <=12 B (Meshtastic cap)" }
  CHANNEL_PSK:           { tag: 0xC2, type: bytes, desc: "Pre-shared key, 1/16/32 B (Meshtastic PSK rules)" }
  CHANNEL_ROLE:          { tag: 0xC3, type: u8,    desc: "0=primary, 1=secondary, 2=disabled" }

  # Remote relay (0xD0-0xDF)
  REMOTE_SERVER_URL:     { tag: 0xD0, type: utf8,  desc: "Relay WSS base URL the device dials out to" }
  REMOTE_DEVICE_PUBKEY:  { tag: 0xD1, type: bytes, desc: "Device ECDSA P-256 public key (raw/uncompressed)" }
  REMOTE_RENDEZVOUS_ID:  { tag: 0xD2, type: bytes, desc: "Opaque rendezvous id the relay routes frames by" }
  REMOTE_ACCOUNT_BIND:   { tag: 0xD3, type: bytes, desc: "Account binding blob provisioned by the phone (server-verified)" }
  REMOTE_STATE:          { tag: 0xD4, type: u8,    desc: "0=off, 1=connecting, 2=online, 3=error" }
  REMOTE_ENROLL_SIG:      { tag: 0xD5, type: bytes, desc: "Device ECDSA P-256 signature (raw r||s, 64 B) over the enrollment binding" }
  REMOTE_ACCOUNT_ECDH_PUB: { tag: 0xD6, type: bytes, desc: "Account ECDH P-256 public key (raw uncompressed, 65 B) for E2E key agreement" }
  REMOTE_DEVICE_ECDH_PUB: { tag: 0xD7, type: bytes, desc: "Device ECDH P-256 public key (raw uncompressed, 65 B) for E2E key agreement" }

  # Errors
  ERR_CODE:              { tag: 0xF0, type: u8 }
  ERR_CONTEXT:           { tag: 0xF1, type: utf8 }

# Mesh payload kinds (values of the KIND TLV).
mesh_kinds:
  CHAT_TEXT:             0x01
  LOC_PING:              0x02
  SENSOR_SAMPLE:         0x03
  ACK:                   0x04
  BEACON:                0x05
  PAIR_REQ:              0x06
  PAIR_RESP:             0x07
  PAIR_CONFIRM:          0x08
  PING:                  0x09
  TRACEROUTE:            0x0A
  NAK:                   0x0B

# Radio regions (values of the REGION TLV / persisted in NVS).
regions:
  KR923:                 0x00
  EU868:                 0x01
  US915:                 0x02

# Node modes (values of the NODE_MODE TLV / persisted in NVS). RELAY is the
# default: send, receive, and rebroadcast. TX_ONLY sends but drops everything
# it hears. RX_ONLY listens and never transmits.
node_modes:
  RELAY:                 0x00
  TX_ONLY:               0x01
  RX_ONLY:               0x02

# Media types (values of the MEDIA_MIME TLV).
media_mimes:
  JPEG:                  0x01
  PNG:                   0x02
  WEBP:                  0x03
  MP4:                   0x10
  QUICKTIME:             0x11

# Media transfer phases (values of the MEDIA_PHASE TLV).
media_phases:
  UPLOADING:             0x01
  OFFERING:              0x02
  SENDING:               0x03
  DONE:                  0x04
  FAILED:                0x05
  CANCELLED:             0x06

# OTA session states (values of the OTA_STATE TLV).
ota_states:
  READY:                 0x01
  RECEIVING:             0x02
  REBOOTING:             0x03
  ABORTED:               0x04

# Generic error codes (value of ERR_CODE TLV)
errors:
  OK:                    0x00
  BAD_ARG:               0x01
  BAD_STATE:             0x02
  UNAUTHED:              0x03
  NOT_FOUND:             0x04
  BUSY:                  0x05
  TIMEOUT:               0x06
  CRYPTO_FAIL:           0x07
  STORAGE_FAIL:          0x08
  NO_SPACE:              0x09
  MESH_OFF:              0x0A
  PEER_UNREACHABLE:      0x0B
  PEER_BUSY:             0x0C
  WRONG_TARGET:          0x0D
  INTERNAL:              0xFF
